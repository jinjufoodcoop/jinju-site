<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>절임배추 주문 취합 (담당자)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E83028; --red-deep:#C0221B; --orange:#F0A800; --green:#A8B048; --teal:#00A8A8; --teal-deep:#00706F;
  --ink:#2B2721; --muted:#6B6358; --bg:#FBF7EF; --panel:#FFFFFF; --soft:#F4EDDF; --line:rgba(43,39,33,.14);
  --ok-bg:#E3F3EF; --no-bg:#FFF1D6; --x-bg:#EEE9E1;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);word-break:keep-all}
.stripe{display:flex;height:5px}.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--red)}.stripe i:nth-child(2){background:var(--orange)}
.stripe i:nth-child(3){background:var(--green)}.stripe i:nth-child(4){background:var(--teal)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
button,input,select{font:inherit}
.btn{border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn.dark{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input[type=password],input[type=search]{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;background:var(--panel);color:var(--ink);width:100%}

/* 로그인 */
.login{max-width:380px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
.err{color:var(--red-deep);font-weight:600;min-height:1.2em;margin:0}

/* 요약 */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools .grow{flex:1 1 200px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat .s2{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--soft);font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:left}
tr.total td{font-weight:700;background:var(--soft)}
td.z{color:#C9C1B4}

/* 필터 */
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 12px;font-weight:600;cursor:pointer;min-height:40px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}

/* 주문 카드 */
.list{display:grid;gap:10px}
.ord{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.ord.paid{border-left-color:var(--teal-deep)}
.ord.canceled{border-left-color:#B5ADA0;opacity:.62}
.ord .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.ord .no{font-weight:700;font-size:17px}
.ord .who{font-weight:700;font-size:17px}
.ord .t{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.no{background:var(--no-bg);color:#8A5A00}
.pill.ok{background:var(--ok-bg);color:var(--teal-deep)}
.pill.x{background:var(--x-bg);color:var(--muted)}
.pill.pick{background:#FDE3E1;color:var(--red-deep);font-size:13px}
.pill.rc{background:#E4ECF7;color:#24497A;font-size:13px}
.ord .items{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:8px;padding:3px 9px;font-weight:600;font-size:14px}
.ord .line{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.ord .line span{color:var(--muted)}
.ord .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:2px}
.ord .amt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.ord .acts{display:flex;gap:8px}
.ord .acts .btn{min-height:38px;padding:6px 12px}
.ord .acts .on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.ord .acts .xon{background:#6B6358;border-color:#6B6358;color:#fff}
/* 수령일 변경 */
.chip.chg{background:#FDE3E1;color:var(--red-deep)}
.chip s{color:var(--muted);font-weight:400}
.chgbox{background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.chgbox .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chgbox .row b{min-width:76px}
.chgbox .orig{color:var(--muted);font-size:13px}
.chgbox select{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px;background:var(--panel);color:var(--ink);max-width:100%}
.chgbox .addrpart,.chgbox .shipbox{display:grid;gap:8px}
.chgbox .addrpart{border-top:1px dashed var(--line);padding-top:10px}
.chgbox input[type=date]{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px;background:var(--panel);color:var(--ink)}
.chgbox input[type=text]{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
.chgbox .row input[type=text]{width:auto;flex:0 1 110px}
.chgbox .row input.payer{flex:0 1 180px}
.chgbox .note{color:var(--muted);font-size:13px;margin:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.foot{margin-top:20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <h1>2026 절임배추 4일 특별 주문 · 취합</h1>
  <p class="sub">담당자 전용 화면입니다. 주문자 개인정보가 있으니 링크와 비밀번호를 밖에 알리지 마세요.</p>

  <form class="login" id="login">
    <label for="pw"><b>비밀번호</b></label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="btn dark" id="loginBtn">들어가기</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>

  <div id="app" hidden>
    <div class="tools">
      <input type="search" id="q" class="grow" placeholder="이름·전화번호·주문번호로 찾기">
      <div class="seg" role="group" aria-label="입금 상태로 거르기">
        <button type="button" data-f="all" aria-pressed="true">전체</button>
        <button type="button" data-f="no" aria-pressed="false">입금 전</button>
        <button type="button" data-f="ok" aria-pressed="false">입금 완료</button>
      </div>
      <button type="button" class="btn" id="reload">새로고침</button>
      <button type="button" class="btn" id="csv">엑셀로 내려받기</button>
      <button type="button" class="btn" id="logout">나가기</button>
    </div>

    <div class="stats" id="stats"></div>

    <h2>발송일별 상자 수 <small id="dayNote">취소 뺀 전체 주문 기준</small></h2>
    <div class="tbl"><table id="days"></table></div>

    <h2>주문 목록 <small id="listNote"></small></h2>
    <div class="list" id="list"></div>
    <p class="foot" id="foot"></p>
  </div>
</div>

<script>
(function(){
  'use strict';
  var SB_URL = 'https://kshhijgecxnngzslpvwe.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_0zmergZcuO4TDW8cXHGzDA_lEy93OL8';
  var KEY = 'jinju.kj.desk';
  var P = { baechu:{name:'절임배추', price:43200}, sok:{name:'김치속', price:87300}, kit:{name:'김장밀키트', price:65700} };
  var DOW = ['일','월','화','수','목','금','토'];
  // 고를 수 있는 발송일 (주문 페이지·서버와 같은 표). 김장밀키트는 12/15~18 발송만
  var SHIP = ['2026-11-17','2026-11-18','2026-11-19','2026-11-20','2026-11-24','2026-11-25','2026-11-26','2026-11-27',
              '2026-12-01','2026-12-02','2026-12-03','2026-12-04','2026-12-08','2026-12-09','2026-12-10','2026-12-11',
              '2026-12-15','2026-12-16','2026-12-17','2026-12-18'];
  var SHIP_KIT = SHIP.filter(function(d){ return d >= '2026-12-15'; });
  // 실제로 보낼 날 — 바꾼 날짜가 있으면 그것, 없으면 주문하신 분이 고른 날짜
  function eff(o, k){ return o['chg_date_' + k] || o['date_' + k]; }
  function changed(o){ return ['baechu','sok','kit'].some(function(k){ return o['qty_' + k] && o['chg_date_' + k]; }); }

  var pass = '', orders = [], filter = 'all', loadedAt = null;
  function $(id){ return document.getElementById(id); }
  function won(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
  function md(d){ if (!d) return ''; var x = new Date(d + 'T00:00:00+09:00'); return (x.getMonth()+1) + '/' + String(x.getDate()).padStart(2,'0') + '(' + DOW[x.getDay()] + ')'; }
  function arrive(d){ var x = new Date(d + 'T00:00:00+09:00'); x.setDate(x.getDate()+1); return (x.getMonth()+1) + '/' + String(x.getDate()).padStart(2,'0') + '(' + DOW[x.getDay()] + ')'; }
  function when(ts){ var x = new Date(ts); return (x.getMonth()+1) + '/' + x.getDate() + ' ' + String(x.getHours()).padStart(2,'0') + ':' + String(x.getMinutes()).padStart(2,'0'); }
  // 주문 페이지는 매장 수령이면 주소 칸에 「매장수령 · ○○점」을 적어 보낸다
  function storeIn(a){ var m = /^매장수령\s*·\s*(.+)$/.exec(a || ''); return m ? m[1] : ''; }
  // 실제로 보낼 곳 — 담당자가 바꾼 주소가 있으면 그것, 없으면 주문하신 분이 적은 주소
  function addrOf(o){ return o.chg_address ? { zip:o.chg_zipcode, address:o.chg_address, detail:o.chg_address_detail }
                                           : { zip:o.zipcode, address:o.address, detail:o.address_detail }; }
  function storeOf(o){ return storeIn(addrOf(o).address); }
  function addrText(a){ return storeIn(a.address) ? storeIn(a.address) + ' 직접 수령' : (a.zip ? '(' + a.zip + ') ' : '') + a.address + (a.detail ? ' ' + a.detail : ''); }
  var STORES = ['금산점','초전점','진양호점'];
  // 현금영수증은 요청사항 맨 앞에 「[현금영수증·개인 010-...]」 으로 붙어 온다 → [종류, 번호, 나머지 요청사항]
  function rcOf(o){ var m = /^\[현금영수증·(\S+) ([^\]]+)\]\s*/.exec(o.memo || ''); return m ? [m[1], m[2], (o.memo || '').slice(m[0].length)] : ['', '', o.memo || '']; }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function rpc(name, body){
    return fetch(SB_URL + '/rpc/' + name, {
      method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  /* ── 들어가기 ── */
  function load(){
    return rpc('kimjang_desk_list', { p_pass: pass }).then(function(r){
      if (r.error) throw { msg: r.error };
      orders = r.orders || []; loadedAt = new Date();
      render();
    });
  }
  $('login').addEventListener('submit', function(e){
    e.preventDefault();
    pass = $('pw').value; $('loginErr').textContent = ''; $('loginBtn').disabled = true;
    load().then(function(){
      try { sessionStorage.setItem(KEY, pass); } catch(err){}
      $('login').hidden = true; $('app').hidden = false;
    }).catch(function(err){
      $('loginErr').textContent = err && err.msg ? err.msg : '불러오지 못했습니다. 통신 상태를 확인해 주세요.';
    }).then(function(){ $('loginBtn').disabled = false; });
  });
  $('logout').addEventListener('click', function(){
    try { sessionStorage.removeItem(KEY); } catch(err){}
    pass = ''; orders = []; $('pw').value = '';
    $('app').hidden = true; $('login').hidden = false;
  });
  try { var saved = sessionStorage.getItem(KEY); if (saved) { $('pw').value = saved; $('loginBtn').click(); } } catch(err){}

  $('reload').addEventListener('click', function(){
    var b = this; b.disabled = true;
    load().catch(function(err){ alertBar(err && err.msg || '불러오지 못했습니다.'); }).then(function(){ b.disabled = false; });
  });
  // 변경 칸을 열어 두고 적는 중이면 저절로 새로 불러오지 않는다 (적던 주소가 지워지지 않게)
  setInterval(function(){ if (pass && !$('app').hidden && !document.hidden && !document.querySelector('.chgbox')) load().catch(function(){}); }, 60000);
  function alertBar(t){ $('foot').textContent = t; }

  /* ── 거르기 ── */
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      filter = b.getAttribute('data-f');
      document.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });
  $('q').addEventListener('input', render);

  function visible(){
    var q = $('q').value.trim().replace(/-/g,'');
    return orders.filter(function(o){
      if (filter === 'no' && (o.paid || o.canceled)) return false;
      if (filter === 'ok' && (!o.paid || o.canceled)) return false;
      if (!q) return true;
      var hay = [o.id, o.orderer_name, o.recipient_name, o.orderer_phone, o.recipient_phone, o.payer_name || ''].join(' ').replace(/-/g,'');
      return hay.indexOf(q) >= 0;
    });
  }

  /* ── 그리기 ── */
  function render(){
    var live = orders.filter(function(o){ return !o.canceled; });
    var paid = live.filter(function(o){ return o.paid; });
    var unpaid = live.filter(function(o){ return !o.paid; });
    function sum(a, f){ return a.reduce(function(s,o){ return s + (o[f]||0); }, 0); }

    var stats = $('stats'); stats.innerHTML = '';
    [
      ['주문', live.length + '건', '취소 ' + (orders.length - live.length) + '건 제외'],
      ['입금 완료', paid.length + '건', won(sum(paid,'total_amount'))],
      ['입금 전', unpaid.length + '건', won(sum(unpaid,'total_amount'))],
      ['절임배추', sum(live,'qty_baechu') + '상자', '입금 ' + sum(paid,'qty_baechu')],
      ['김치속', sum(live,'qty_sok') + '상자', '입금 ' + sum(paid,'qty_sok')],
      ['김장밀키트', sum(live,'qty_kit') + '상자', '입금 ' + sum(paid,'qty_kit')],
      ['매장 수령', live.filter(storeOf).length + '건', ['금산점','초전점','진양호점'].map(function(s){
        return s.replace('점','') + ' ' + live.filter(function(o){ return storeOf(o) === s; }).length; }).join(' · ')],
      ['현금영수증', live.filter(function(o){ return rcOf(o)[0]; }).length + '건', '개인 ' + live.filter(function(o){ return rcOf(o)[0] === '개인'; }).length + ' · 사업자 ' + live.filter(function(o){ return rcOf(o)[0] === '사업자'; }).length],
      ['변경 요청 반영', live.filter(function(o){ return changed(o) || o.chg_address; }).length + '건',
        '수령일 ' + live.filter(changed).length + ' · 받는 곳 ' + live.filter(function(o){ return o.chg_address; }).length]
    ].forEach(function(s){
      var d = el('div','stat'); d.appendChild(el('small',null,s[0])); d.appendChild(el('b',null,s[1])); d.appendChild(el('div','s2',s[2])); stats.appendChild(d);
    });

    // 발송일별
    var base = filter === 'ok' ? paid : filter === 'no' ? unpaid : live;
    $('dayNote').textContent = (filter === 'ok' ? '입금 완료 주문 기준' : filter === 'no' ? '입금 전 주문 기준' : '취소 뺀 전체 주문 기준') + ' · 바꾼 수령일 반영';
    var days = {};
    base.forEach(function(o){
      ['baechu','sok','kit'].forEach(function(k){
        var q = o['qty_' + k], d = eff(o, k);
        if (!q || !d) return;
        days[d] = days[d] || { baechu:0, sok:0, kit:0 };
        days[d][k] += q;
      });
    });
    var t = $('days'); t.innerHTML = '';
    var hr = t.insertRow(); ['발송일 → 도착','절임배추','김치속','김장밀키트','합계'].forEach(function(h){ var th = el('th',null,h); hr.appendChild(th); });
    var keys = Object.keys(days).sort(), tot = { baechu:0, sok:0, kit:0 };
    if (!keys.length) { var r0 = t.insertRow(); var c0 = r0.insertCell(); c0.colSpan = 5; c0.textContent = '아직 없습니다'; c0.style.textAlign = 'center'; }
    keys.forEach(function(d){
      var r = t.insertRow(), v = days[d];
      r.insertCell().textContent = md(d) + ' → ' + arrive(d);
      ['baechu','sok','kit'].forEach(function(k){ var c = r.insertCell(); c.textContent = v[k]; if (!v[k]) c.className = 'z'; tot[k] += v[k]; });
      r.insertCell().textContent = v.baechu + v.sok + v.kit;
    });
    if (keys.length) {
      var rt = t.insertRow(); rt.className = 'total';
      rt.insertCell().textContent = '합계';
      ['baechu','sok','kit'].forEach(function(k){ rt.insertCell().textContent = tot[k]; });
      rt.insertCell().textContent = tot.baechu + tot.sok + tot.kit;
    }

    // 목록
    var vis = visible(), list = $('list'); list.innerHTML = '';
    $('listNote').textContent = vis.length + '건 · 최근 주문이 위';
    if (!vis.length) list.appendChild(el('div','empty', orders.length ? '찾는 주문이 없습니다.' : '아직 들어온 주문이 없습니다. 주문이 들어오면 여기에 한 건씩 나옵니다.'));
    vis.forEach(function(o){ list.appendChild(card(o)); });
    $('foot').textContent = loadedAt ? '불러온 시각 ' + when(loadedAt) + ' · 1분마다 저절로 새로 불러옵니다' : '';
  }

  function card(o){
    var c = el('article', 'ord' + (o.canceled ? ' canceled' : o.paid ? ' paid' : ''));
    var hd = el('div','hd');
    hd.appendChild(el('span','no','#' + o.id));
    hd.appendChild(el('span','who',o.orderer_name));
    hd.appendChild(el('span','t',o.orderer_phone));
    hd.appendChild(el('span','pill ' + (o.canceled ? 'x' : o.paid ? 'ok' : 'no'),
      o.canceled ? '취소' : o.paid ? '입금 완료 · ' + (o.paid_date ? md(o.paid_date) : '입금일 없음') : '입금 전'));
    hd.appendChild(el('span','t','주문 ' + when(o.created_at)));
    c.appendChild(hd);

    var it = el('div','items');
    ['baechu','sok','kit'].forEach(function(k){
      if (!o['qty_' + k]) return;
      var cd = o['chg_date_' + k];
      if (!cd) { it.appendChild(el('span','chip', P[k].name + ' ' + o['qty_' + k] + ' · ' + md(o['date_' + k]) + ' 발송 → ' + arrive(o['date_' + k]) + ' 수령')); return; }
      // 바꾼 경우: 주문하신 날짜는 줄 그어 남기고, 바꾼 날짜를 함께 보여 준다
      var ch = el('span','chip chg', P[k].name + ' ' + o['qty_' + k] + ' · ');
      ch.appendChild(el('s', null, md(o['date_' + k]) + ' 발송'));
      ch.appendChild(document.createTextNode(' ▶ 변경 ' + md(cd) + ' 발송 → ' + arrive(cd) + ' 수령'));
      it.appendChild(ch);
    });
    c.appendChild(it);
    if (o.chg_at && changed(o)) c.appendChild(el('div','t','수령일 바꾼 때 ' + when(o.chg_at)));

    var to = el('div','line'); to.appendChild(el('span',null,'받는 분 '));
    to.appendChild(document.createTextNode(o.recipient_name + ' ' + o.recipient_phone));
    c.appendChild(to);
    var ad = el('div','line');
    if (o.chg_address) {
      // 바꾼 경우: 주문하신 주소는 줄 그어 남기고, 바꾼 곳을 함께 보여 준다
      ad.appendChild(el('span',null,'받는 곳 '));
      ad.appendChild(el('s', null, addrText({ zip:o.zipcode, address:o.address, detail:o.address_detail })));
      ad.appendChild(document.createTextNode(' ▶ '));
      ad.appendChild(el('span', 'pill pick', '변경 ' + addrText(addrOf(o))));
    } else if (storeOf(o)) {
      ad.appendChild(el('span',null,'받는 곳 '));
      ad.appendChild(el('span','pill pick', storeOf(o) + ' 직접 수령'));
    } else {
      ad.appendChild(el('span',null,'주소 '));
      ad.appendChild(document.createTextNode(addrText(addrOf(o))));
    }
    c.appendChild(ad);
    if (o.chg_address && o.chg_addr_at) c.appendChild(el('div','t','받는 곳 바꾼 때 ' + when(o.chg_addr_at)));
    var rcv = rcOf(o);
    if (rcv[0]) { var rl = el('div','line'); rl.appendChild(el('span',null,'현금영수증 ')); rl.appendChild(el('span','pill rc', rcv[0] + ' ' + rcv[1])); c.appendChild(rl); }
    if (rcv[2]) { var m = el('div','line'); m.appendChild(el('span',null,'요청 ')); m.appendChild(document.createTextNode(rcv[2])); c.appendChild(m); }

    var ft = el('div','ft');
    ft.appendChild(el('span','amt', won(o.total_amount)));
    var acts = el('div','acts');
    var bp = el('button','btn' + (o.paid ? ' on' : ''), o.paid ? '✓ 입금 확인됨' : '입금 확인');
    bp.type = 'button'; bp.setAttribute('aria-pressed', String(!!o.paid));
    bp.addEventListener('click', function(){
      if (!o.paid) {   // 입금 확인 → 입금일 고르는 칸 열기
        var open = c.querySelector('.chgbox.pay');
        if (open) { open.remove(); delete openPay[o.id]; return; }
        c.appendChild(payBox(o)); return;
      }
      // 입금 확인 풀기는 한 번 더 묻는다 (입금일도 함께 지워지므로)
      if (bp.getAttribute('data-sure') !== '1') { bp.setAttribute('data-sure','1'); bp.textContent = '입금 확인 풀까요?'; setTimeout(function(){ if (bp.isConnected && o.paid) { bp.removeAttribute('data-sure'); bp.textContent = '✓ 입금 확인됨'; } }, 3000); return; }
      pay(o, false, null, bp);
    });
    var bx = el('button','btn' + (o.canceled ? ' xon' : ''), o.canceled ? '취소 풀기' : '취소');
    bx.type = 'button';
    bx.addEventListener('click', function(){
      if (!o.canceled && bx.getAttribute('data-sure') !== '1') { bx.setAttribute('data-sure','1'); bx.textContent = '정말 취소?'; setTimeout(function(){ if (bx.isConnected && !o.canceled) { bx.removeAttribute('data-sure'); bx.textContent = '취소'; } }, 3000); return; }
      mark(o, 'canceled', !o.canceled, bx);
    });
    var bd = el('button','btn','수령일·주소 변경');
    bd.type = 'button'; bd.setAttribute('aria-expanded','false');
    bd.addEventListener('click', function(){
      var open = c.querySelector('.chgbox:not(.pay)');
      if (open) { open.remove(); delete openBox[o.id]; bd.setAttribute('aria-expanded','false'); return; }
      c.appendChild(chgBox(o)); bd.setAttribute('aria-expanded','true');
    });
    acts.appendChild(bd); acts.appendChild(bp); acts.appendChild(bx);
    ft.appendChild(acts);
    c.appendChild(ft);
    if (o.paid && !o.canceled) {
      var pl = el('div','line'); pl.appendChild(el('span',null,'입금일 '));
      pl.appendChild(document.createTextNode(o.paid_date ? md(o.paid_date) + ' ' : '아직 안 적음 '));
      if (o.payer_name) { pl.appendChild(el('span',null,'· 입금자 ')); pl.appendChild(el('b',null,o.payer_name)); pl.appendChild(document.createTextNode(' ')); }
      var pe = el('button','btn', o.paid_date ? '입금일·입금자 고치기' : '입금일 적기'); pe.type = 'button';
      pe.style.minHeight = '32px'; pe.style.padding = '2px 10px'; pe.style.fontSize = '13px';
      pe.addEventListener('click', function(){
        var open = c.querySelector('.chgbox.pay');
        if (open) { open.remove(); delete openPay[o.id]; return; }
        c.appendChild(payBox(o));
      });
      pl.appendChild(pe);
      c.insertBefore(pl, ft);
    }
    if (openBox[o.id]) c.appendChild(chgBox(o));
    if (openPay[o.id]) c.appendChild(payBox(o));
    return c;
  }

  /* ── 입금 확인 + 입금일 ── */
  var openPay = {};
  function todayKST(){ return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }
  function payBox(o){
    openPay[o.id] = true;
    var box = el('div','chgbox pay');
    box.appendChild(el('p','note','통장에 돈이 들어온 날을 골라 주세요. 입금자 이름이 주문자(' + o.orderer_name + ')와 다르면 입금자명도 적어 주세요. 회계 확인용으로 엑셀에도 나옵니다.'));
    var row0 = el('div','row'); row0.appendChild(el('b',null,'입금자명'));
    var nm = document.createElement('input'); nm.type = 'text'; nm.maxLength = 30; nm.setAttribute('aria-label','입금자명');
    nm.placeholder = '주문자와 다를 때만'; nm.value = o.payer_name || ''; nm.className = 'payer';
    row0.appendChild(nm);
    box.appendChild(row0);
    var row = el('div','row'); row.appendChild(el('b',null,'입금일'));
    var inp = document.createElement('input'); inp.type = 'date'; inp.setAttribute('aria-label','입금일');
    inp.min = '2026-11-01'; inp.max = todayKST(); inp.value = o.paid_date || todayKST();
    row.appendChild(inp);
    var ok = el('button','btn dark', o.paid ? '저장' : '입금 확인'); ok.type = 'button';
    ok.addEventListener('click', function(){
      if (!inp.value) { alertBar('입금일을 골라 주세요.'); inp.focus(); return; }
      if (inp.value < inp.min || inp.value > inp.max) { alertBar('입금일을 확인해 주세요. (11월 1일부터 오늘까지)'); inp.focus(); return; }
      var who = nm.value.trim();
      if (who === String(o.orderer_name || '').trim()) who = '';   // 주문자와 같으면 따로 적지 않는다
      pay(o, true, inp.value, ok, who);
    });
    row.appendChild(ok);
    var cl = el('button','btn','닫기'); cl.type = 'button';
    cl.addEventListener('click', function(){ delete openPay[o.id]; render(); });
    row.appendChild(cl);
    box.appendChild(row);
    return box;
  }
  function pay(o, paid, d, btn, who){
    btn.disabled = true;
    who = paid ? (who || '') : '';
    rpc('kimjang_desk_pay', { p_pass: pass, p_id: o.id, p_paid: paid, p_date: d, p_payer: who || null })
      .then(function(r){
        if (r.error) throw { msg: r.error };
        o.paid = paid; o.paid_date = paid ? d : null; o.payer_name = who || null;
        delete openPay[o.id];
        render();
        alertBar('#' + o.id + ' ' + o.orderer_name + ' · ' + (paid ? '입금 확인 (입금일 ' + md(d) + (who ? ' · 입금자 ' + who : '') + ')' : '입금 확인을 풀었습니다.'));
      })
      .catch(function(err){ btn.disabled = false; alertBar((err && err.msg) || '저장하지 못했습니다. 다시 눌러 주세요.'); });
  }

  /* ── 수령일 바꾸기 ── */
  var openBox = {};   // 저장 뒤 다시 그려도 열어 둔 칸이 닫히지 않게
  function chgBox(o){
    openBox[o.id] = true;
    var box = el('div','chgbox');
    box.appendChild(el('p','note','주문하신 분이 고른 날짜·주소는 그대로 남습니다. 바꾼 것은 따로 적혀, 발송일별 상자 수·매장 수령 수·엑셀에 반영됩니다.'));
    ['baechu','sok','kit'].forEach(function(k){
      if (!o['qty_' + k]) return;
      var row = el('div','row');
      row.appendChild(el('b', null, P[k].name));
      row.appendChild(el('span','orig','주문 ' + md(o['date_' + k]) + ' 발송 → ' + arrive(o['date_' + k]) + ' 수령'));
      var sel = document.createElement('select');
      sel.setAttribute('aria-label', P[k].name + ' 바꿀 날짜');
      (k === 'kit' ? SHIP_KIT : SHIP).forEach(function(d){
        var op = document.createElement('option'); op.value = d;
        op.textContent = md(d) + ' 발송 → ' + arrive(d) + ' 수령' + (d === o['date_' + k] ? ' (주문한 날)' : '');
        if (d === eff(o, k)) op.selected = true;
        sel.appendChild(op);
      });
      row.appendChild(sel);
      var save = el('button','btn dark','저장'); save.type = 'button';
      save.addEventListener('click', function(){ setDate(o, k, sel.value === o['date_' + k] ? null : sel.value, save); });
      row.appendChild(save);
      if (o['chg_date_' + k]) {
        var back = el('button','btn','주문한 날로 되돌리기'); back.type = 'button';
        back.addEventListener('click', function(){ setDate(o, k, null, back); });
        row.appendChild(back);
      }
      box.appendChild(row);
    });
    box.appendChild(addrPart(o));
    var close = el('button','btn','닫기'); close.type = 'button';
    close.addEventListener('click', function(){ delete openBox[o.id]; render(); });
    var cr = el('div','row'); cr.appendChild(close); box.appendChild(cr);
    return box;
  }

  /* ── 받는 곳(택배 주소 · 매장) 바꾸기 ── */
  function addrPart(o){
    var cur = addrOf(o), wrap = el('div','addrpart');
    var r1 = el('div','row'); r1.appendChild(el('b',null,'받는 곳'));
    r1.appendChild(el('span','orig','주문 ' + addrText({ zip:o.zipcode, address:o.address, detail:o.address_detail })));
    wrap.appendChild(r1);

    var r2 = el('div','row');
    var sel = document.createElement('select'); sel.setAttribute('aria-label','받는 방법');
    [['ship','택배로 받기']].concat(STORES.map(function(s){ return [s, s + ' 직접 수령']; })).forEach(function(v){
      var op = document.createElement('option'); op.value = v[0]; op.textContent = v[1]; sel.appendChild(op);
    });
    sel.value = storeIn(cur.address) || 'ship';
    r2.appendChild(sel); wrap.appendChild(r2);

    var ship = el('div','shipbox');
    var r3 = el('div','row');
    var zip = document.createElement('input'); zip.type = 'text'; zip.placeholder = '우편번호'; zip.setAttribute('aria-label','우편번호'); zip.size = 7;
    var find = el('button','btn','주소 찾기'); find.type = 'button';
    r3.appendChild(zip); r3.appendChild(find); ship.appendChild(r3);
    var addr = document.createElement('input'); addr.type = 'text'; addr.placeholder = '주소'; addr.setAttribute('aria-label','주소');
    var det = document.createElement('input'); det.type = 'text'; det.placeholder = '상세주소 (동·호수)'; det.setAttribute('aria-label','상세주소');
    ship.appendChild(addr); ship.appendChild(det);
    if (!storeIn(cur.address)) { zip.value = cur.zip || ''; addr.value = cur.address || ''; det.value = cur.detail || ''; }
    wrap.appendChild(ship);
    function syncWay(){ ship.hidden = sel.value !== 'ship'; }
    sel.addEventListener('change', syncWay); syncWay();

    find.addEventListener('click', function(){
      loadPostcode(function(ok){
        if (!ok) { alertBar('주소 찾기를 불러오지 못했습니다. 주소를 직접 적어 주세요.'); addr.focus(); return; }
        new daum.Postcode({ oncomplete: function(r){
          zip.value = r.zonecode; addr.value = r.roadAddress || r.jibunAddress; det.value = ''; det.focus();
        }}).open();
      });
    });

    var r4 = el('div','row');
    var save = el('button','btn dark','받는 곳 저장'); save.type = 'button';
    save.addEventListener('click', function(){
      if (sel.value === 'ship') {
        if (addr.value.trim().length < 5) { alertBar('주소를 적어 주세요.'); addr.focus(); return; }
        setAddr(o, zip.value.trim(), addr.value.trim(), det.value.trim(), save);
      } else setAddr(o, '', '매장수령 · ' + sel.value, '', save);
    });
    r4.appendChild(save);
    if (o.chg_address) {
      var back = el('button','btn','주문한 곳으로 되돌리기'); back.type = 'button';
      back.addEventListener('click', function(){ setAddr(o, null, null, null, back); });
      r4.appendChild(back);
    }
    wrap.appendChild(r4);
    return wrap;
  }

  var pcState = 0, pcWait = [];   // 우편번호 찾기(다음 주소) 스크립트는 처음 누를 때만 불러온다
  function loadPostcode(cb){
    if (window.daum && daum.Postcode) return cb(true);
    pcWait.push(cb); if (pcState) return; pcState = 1;
    var s = document.createElement('script');
    s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload = function(){ pcState = 0; pcWait.splice(0).forEach(function(f){ f(!!(window.daum && daum.Postcode)); }); };
    s.onerror = function(){ pcState = 0; pcWait.splice(0).forEach(function(f){ f(false); }); };
    document.head.appendChild(s);
  }

  function setAddr(o, z, a, d, btn){
    // 주문하신 곳과 똑같으면 「되돌리기」로 친다
    if (a && a === o.address && (z || '') === (o.zipcode || '') && (d || '') === (o.address_detail || '')) { z = a = d = null; }
    btn.disabled = true;
    rpc('kimjang_desk_set_addr', { p_pass: pass, p_id: o.id, p_zipcode: z, p_address: a, p_address_detail: d })
      .then(function(r){
        if (r.error) throw { msg: r.error };
        o.chg_zipcode = a ? (storeIn(a) ? null : z || null) : null;
        o.chg_address = a || null;
        o.chg_address_detail = a ? (storeIn(a) ? null : d || null) : null;
        o.chg_addr_at = new Date().toISOString();
        delete openBox[o.id];
        render();
        alertBar('#' + o.id + ' ' + o.orderer_name + ' · 받는 곳을 ' + (a ? addrText(addrOf(o)) + '(으)로 바꿨습니다.' : '주문한 곳으로 되돌렸습니다.'));
      })
      .catch(function(err){ btn.disabled = false; alertBar((err && err.msg) || '저장하지 못했습니다. 다시 눌러 주세요.'); });
  }

  function setDate(o, k, d, btn){
    btn.disabled = true;
    rpc('kimjang_desk_set_date', { p_pass: pass, p_id: o.id, p_item: k, p_date: d })
      .then(function(r){
        if (r.error) throw { msg: r.error };
        o['chg_date_' + k] = d; o.chg_at = new Date().toISOString();
        delete openBox[o.id];
        render();
        alertBar('#' + o.id + ' ' + o.orderer_name + ' · ' + P[k].name + ' 수령일을 ' + (d ? md(d) + ' 발송 → ' + arrive(d) + ' 수령으로 바꿨습니다.' : '주문한 날로 되돌렸습니다.'));
      })
      .catch(function(err){ btn.disabled = false; alertBar((err && err.msg) || '저장하지 못했습니다. 다시 눌러 주세요.'); });
  }

  function mark(o, field, value, btn){
    btn.disabled = true;
    rpc('kimjang_desk_mark', { p_pass: pass, p_id: o.id, p_field: field, p_value: value })
      .then(function(r){
        if (r.error) throw { msg: r.error };
        o[field] = value; render();
      })
      .catch(function(err){ btn.disabled = false; alertBar((err && err.msg) || '저장하지 못했습니다. 다시 눌러 주세요.'); });
  }

  /* ── 엑셀(CSV) 내려받기 ── */
  $('csv').addEventListener('click', function(){
    var head = ['주문번호','주문시각','상태','받는방법','주문자','주문자전화','받는분','받는분전화','우편번호','주소','상세주소',
                '절임배추','절임배추발송일','절임배추변경발송일','김치속','김치속발송일','김치속변경발송일','김장밀키트','밀키트발송일','밀키트변경발송일',
                '금액','현금영수증','현금영수증번호','요청사항','변경받는방법','변경우편번호','변경주소','변경상세주소','입금일','입금자명(주문자와 다를 때)'];
    var rows = visible().slice().sort(function(a,b){ return a.id - b.id; }).map(function(o){
      var st0 = storeIn(o.address), chgCols = o.chg_address
        ? [storeOf(o) ? storeOf(o) + ' 수령' : '택배', o.chg_zipcode || '', storeOf(o) ? '' : o.chg_address, o.chg_address_detail || '']
        : ['', '', '', ''];
      return [o.id, when(o.created_at), o.canceled ? '취소' : o.paid ? '입금완료' : '입금전', st0 ? st0 + ' 수령' : '택배',
        o.orderer_name, o.orderer_phone, o.recipient_name, o.recipient_phone, o.zipcode || '', o.address, o.address_detail || '',
        o.qty_baechu, o.date_baechu || '', o.qty_baechu ? o.chg_date_baechu || '' : '',
        o.qty_sok, o.date_sok || '', o.qty_sok ? o.chg_date_sok || '' : '',
        o.qty_kit, o.date_kit || '', o.qty_kit ? o.chg_date_kit || '' : '',
        o.total_amount].concat(rcOf(o), chgCols, [o.paid && o.paid_date ? o.paid_date : '', o.paid && o.payer_name ? o.payer_name : '']);
    });
    var csv = [head].concat(rows).map(function(r){
      return r.map(function(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '2026절임배추_특별주문_' + (d.getMonth()+1) + '월' + d.getDate() + '일' + String(d.getHours()).padStart(2,'0') + '시.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
})();
</script>
</body>
</html>
