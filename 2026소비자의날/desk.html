<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소비자의날 응원판 · 담당자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E83028; --red-deep:#C0221B; --orange:#F0A800; --green:#A8B048; --green-deep:#4F5722; --teal:#00A8A8; --teal-deep:#00706F;
  --ink:#2B2721; --muted:#6B6358; --bg:#FBF7EF; --panel:#FFFFFF; --soft:#F4EDDF; --leaf:#EEF2DC; --line:rgba(43,39,33,.14);
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);word-break:keep-all}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 40px}
.stripe{display:flex;height:6px}.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--red)}.stripe i:nth-child(2){background:var(--orange)}
.stripe i:nth-child(3){background:var(--green)}.stripe i:nth-child(4){background:var(--teal)}
h1{font-size:22px;margin:18px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.sub a{color:var(--teal-deep)}
button{font:600 15px var(--sans);border-radius:10px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);padding:0 14px;min-height:40px;cursor:pointer}
button.pri{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
button.warn{border-color:var(--red-deep);color:var(--red-deep)}
input[type=password],input[type=search]{font:500 15px var(--sans);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;background:var(--panel);color:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.login{max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px;display:grid;gap:10px}
.err{color:var(--red-deep);font-weight:600;min-height:1em}
.state{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:36px;font-size:14px;border-color:var(--line)}
.tabs button.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.tools input[type=search]{flex:1;min-width:180px}
.list{display:grid;gap:10px}
.o{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.o.hid{border-left-color:#999;opacity:.6}
.o .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.o .no{font-weight:700}
.o .when{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--ink)}
.tag.h{background:#777;color:#fff}
.tag.l{background:#FFE3DE;color:var(--red-deep)}
.o .msgtx{font-size:17px;white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:8px 12px}
.o .who{font-size:15px}
.o .who small{color:var(--muted)}
.o .memo{background:var(--leaf);border-radius:8px;padding:6px 10px;font-size:14px}
.o .acts{display:flex;flex-wrap:wrap;gap:6px}
.o .acts button{min-height:36px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:30px}
.preview{background:#FFF4D6;border:1.5px solid var(--orange);border-radius:10px;padding:8px 12px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <h1>소비자의날 가치소비 응원판</h1>
  <p class="sub">담당자 전용 · 참여 페이지 <a href="./" target="_blank">jjcoop.co.kr/2026소비자의날</a> · 이름·연락처는 이 화면에서만 보입니다</p>
  <div class="preview" id="previewNote" hidden>미리보기입니다 — 보이는 자료는 시험용 가짜이고, 눌러도 서버에 저장되지 않습니다.</div>

  <form class="login" id="login" autocomplete="on">
    <label for="pw"><b>비밀번호</b> <small style="color:var(--muted)">(절임배추 담당자 화면과 같음)</small></label>
    <input type="password" id="pw" autocomplete="current-password">
    <button type="submit" class="pri">들어가기</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>

  <div id="main" hidden>
    <div class="state">
      <div id="openText"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" id="toggleOpen"></button>
        <button type="button" id="reload">새로 불러오기</button>
        <button type="button" id="logout">나가기</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="tabs" id="tabs" role="tablist"></div>
      <input type="search" id="q" placeholder="이름·전화 뒷자리·글 내용 찾기">
    </div>
    <div class="tools">
      <button type="button" id="dlAll">전체 엑셀</button>
      <span class="err" id="msg" role="alert"></span>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var SB_URL = 'https://kshhijgecxnngzslpvwe.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_0zmergZcuO4TDW8cXHGzDA_lEy93OL8';
  var KEY = 'cday2026_desk_pw';
  var PREVIEW = !/jjcoop\.co\.kr$/.test(location.hostname);
  var pass = '', rows = [], isOpen = true, tab = 'all';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function today(){ return new Date(Date.now() + 9*36e5).toISOString().slice(0,10); }
  function fmtTime(t){ var d = new Date(t); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

  var FAKE = [
    {id:2,created_at:new Date().toISOString(),name:'시험둘',phone:'010-0000-0002',stores:['초전점'],topic:'진주텃밭을 이용하는 이유',message:'시험 응원 글입니다.',likes:5,hidden:false,staff_note:null},
    {id:1,created_at:new Date(Date.now()-36e5).toISOString(),name:'시험하나',phone:'010-0000-0001',stores:['금산점','진양호점'],topic:'가치소비를 느낀 순간',message:'숨긴 시험 글입니다.',likes:0,hidden:true,staff_note:'광고글'}
  ];

  function rpc(name, body){
    if (PREVIEW) {
      if (name === 'cday2026_desk_list') return Promise.resolve({ open:isOpen, rows: rows.length ? rows : FAKE.map(function(o){ return Object.assign({}, o); }) });
      if (name === 'cday2026_desk_set_open') return Promise.resolve({ ok:true, open: body.p_open });
      if (name === 'cday2026_desk_mark') {
        var o = rows.filter(function(x){ return x.id === body.p_id; })[0];
        if (body.p_field === 'note') o.staff_note = body.p_text || null; else o[body.p_field] = body.p_value;
        return Promise.resolve({ ok:true });
      }
    }
    return fetch(SB_URL + '/rpc/' + name, {
      method:'POST', headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error((j && j.message) || '서버 오류'); return j; }); });
  }

  $('login').addEventListener('submit', function(e){ e.preventDefault(); pass = $('pw').value; $('loginErr').textContent = ''; load(true); });
  $('logout').addEventListener('click', function(){
    try { sessionStorage.removeItem(KEY); } catch(err){}
    pass = ''; rows = []; $('pw').value = ''; $('main').hidden = true; $('login').hidden = false;
  });
  $('reload').addEventListener('click', function(){ load(false); });

  function load(first){
    $('msg').textContent = '';
    return rpc('cday2026_desk_list', { p_pass: pass }).then(function(j){
      if (j.error) { if (first) $('loginErr').textContent = j.error; else $('msg').textContent = j.error; return; }
      try { sessionStorage.setItem(KEY, pass); } catch(err){}
      rows = j.rows || []; isOpen = j.open !== false;
      $('login').hidden = true; $('main').hidden = false;
      render();
    }).catch(function(err){
      var m = '불러오지 못했습니다. ' + (err && err.message || '');
      if (first) $('loginErr').textContent = m; else $('msg').textContent = m;
    });
  }

  $('toggleOpen').addEventListener('click', function(){
    var next = !isOpen;
    if (!confirm(next ? '응원을 다시 받을까요?' : '응원 남기기를 마감할까요?\n응원판은 계속 보이고, 새 글만 못 남깁니다.')) return;
    rpc('cday2026_desk_set_open', { p_pass: pass, p_open: next }).then(function(j){
      if (j.error) { $('msg').textContent = j.error; return; }
      isOpen = j.open; render();
    }).catch(function(err){ $('msg').textContent = '바꾸지 못했습니다. ' + (err && err.message || ''); });
  });

  var TABS = [
    ['all','보이는 글', function(o){ return !o.hidden; }],
    ['like','좋아요 순', function(o){ return !o.hidden; }],
    ['hidden','숨긴 글', function(o){ return o.hidden; }]
  ];
  function tabFn(k){ return TABS.filter(function(t){ return t[0] === k; })[0][2]; }
  $('q').addEventListener('input', renderList);

  function render(){
    $('openText').innerHTML = isOpen
      ? '<span class="dot" style="background:var(--teal)"></span><b>지금 응원 받는 중</b>'
      : '<span class="dot" style="background:var(--red)"></span><b>응원 마감</b> <small style="color:var(--muted)">(응원판은 계속 보임)</small>';
    $('toggleOpen').textContent = isOpen ? '응원 마감하기' : '응원 다시 받기';
    $('toggleOpen').className = isOpen ? 'warn' : 'pri';

    var live = rows.filter(function(o){ return !o.hidden; });
    var people = {}; live.forEach(function(o){ people[(o.phone || '').replace(/\D/g,'')] = 1; });
    var byStore = { '금산점':0, '초전점':0, '진양호점':0 };
    live.forEach(function(o){ (o.stores || []).forEach(function(s){ if (s in byStore) byStore[s]++; }); });
    var likes = live.reduce(function(a, o){ return a + (o.likes || 0); }, 0);
    function st(label, n){ return '<div class="stat"><small>' + label + '</small><b>' + n + '</b></div>'; }
    $('stats').innerHTML =
      st('응원 글 (숨김 빼고)', live.length) +
      st('참여한 사람', Object.keys(people).length) +
      st('좋아요 합계', likes) +
      st('금산점', byStore['금산점']) + st('초전점', byStore['초전점']) + st('진양호점', byStore['진양호점']);

    $('tabs').innerHTML = TABS.map(function(t){
      return '<button type="button" role="tab" data-k="' + t[0] + '" class="' + (t[0] === tab ? 'cur' : '') + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + ' ' + rows.filter(t[2]).length + '</button>';
    }).join('');
    $('tabs').querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ tab = b.getAttribute('data-k'); render(); }); });
    renderList();
  }

  function renderList(){
    var q = $('q').value.trim().toLowerCase().replace(/-/g,'');
    var list = rows.filter(tabFn(tab)).filter(function(o){
      if (!q) return true;
      return [o.id, o.name, o.phone, o.message, (o.stores || []).join(' '), o.staff_note].join(' ').toLowerCase().replace(/-/g,'').indexOf(q) >= 0;
    });
    if (tab === 'like') list = list.slice().sort(function(a,b){ return b.likes - a.likes || a.id - b.id; });
    if (!list.length) { $('list').innerHTML = '<div class="empty">아직 없습니다.</div>'; return; }
    $('list').innerHTML = list.map(card).join('');
    $('list').querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click', act); });
  }

  function card(o){
    return '<div class="o' + (o.hidden ? ' hid' : '') + '">' +
      '<div class="hd"><span class="no">#' + o.id + '</span><span class="when">' + fmtTime(o.created_at) + '</span>' +
        '<span class="tag">' + esc(o.topic) + '</span><span class="tag l">♥ ' + o.likes + '</span>' +
        (o.hidden ? '<span class="tag h">숨김</span>' : '') + '</div>' +
      '<div class="msgtx">' + esc(o.message) + '</div>' +
      '<div class="who"><small>쓴 분</small> <b>' + esc(o.name) + '</b> ' + esc(o.phone) + ' · <small>매장</small> ' + esc((o.stores || []).join('·')) + '</div>' +
      (o.staff_note ? '<div class="memo">직원 메모: ' + esc(o.staff_note) + '</div>' : '') +
      '<div class="acts">' +
        (o.hidden ? '<button type="button" class="pri" data-act="show" data-id="' + o.id + '">다시 보이기</button>'
                  : '<button type="button" class="warn" data-act="hide" data-id="' + o.id + '">응원판에서 숨기기</button>') +
        '<button type="button" data-act="note" data-id="' + o.id + '">메모</button>' +
      '</div></div>';
  }

  function mark(id, field, value, text){
    $('msg').textContent = '';
    return rpc('cday2026_desk_mark', { p_pass: pass, p_id: id, p_field: field, p_value: value, p_text: text == null ? null : text })
      .then(function(j){ if (j.error) { $('msg').textContent = j.error; return; } load(false); })
      .catch(function(err){ $('msg').textContent = '저장하지 못했습니다. ' + (err && err.message || ''); });
  }
  function act(){
    var id = Number(this.getAttribute('data-id')), a = this.getAttribute('data-act');
    var o = rows.filter(function(x){ return x.id === id; })[0];
    if (a === 'hide') { if (confirm('#' + id + ' 글을 응원판에서 숨길까요?\n(지워지지 않고, 언제든 다시 보이게 할 수 있습니다)')) mark(id, 'hidden', true); return; }
    if (a === 'show') return mark(id, 'hidden', false);
    if (a === 'note') { var t = prompt('직원 메모 (비우면 지움)', o.staff_note || ''); if (t !== null) mark(id, 'note', false, t); }
  }

  function csv(r){ return '﻿' + r.map(function(x){ return x.map(function(v){ v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(','); }).join('\r\n'); }
  function save(name, text){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  $('dlAll').addEventListener('click', function(){
    var r = [['번호','남긴 때','이름','연락처','금산점','초전점','진양호점','이야기','응원 글','좋아요','숨김','직원메모']];
    rows.slice().reverse().forEach(function(o){
      var s = o.stores || [];
      r.push([o.id, new Date(o.created_at).toLocaleString('ko-KR'), o.name, o.phone,
        s.indexOf('금산점') >= 0 ? 'O' : '', s.indexOf('초전점') >= 0 ? 'O' : '', s.indexOf('진양호점') >= 0 ? 'O' : '',
        o.topic, o.message, o.likes, o.hidden ? 'O' : '', o.staff_note]);
    });
    save('소비자의날응원판_전체_' + today().replace(/-/g,'') + '.csv', csv(r));
  });

  if (PREVIEW) { $('previewNote').hidden = false; $('pw').value = '미리보기'; }
  try { var saved = sessionStorage.getItem(KEY); if (saved && !PREVIEW) { $('pw').value = saved; pass = saved; load(true); } } catch(err){}
})();
</script>
</body>
</html>
